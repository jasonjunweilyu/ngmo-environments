channels:
  - conda-forge
  - conda-pypi

dependencies:
  - python=3.12.*

  # Anemoi packages (latest releases on conda-forge as of 2026-11-16).
  # Their conda-forge recipes already pull in all compulsory pyproject.toml
  # dependencies, except the pip "extras" and pyodc listed further below.
  # Only training and inference are top-level; the others are listed to pin minimum versions.
  - anemoi-training>=0.17.2
  - anemoi-inference>=0.14.1
#  - anemoi-datasets>=0.5.50  # also pulled in by anemoi-training
#  - anemoi-transform>=0.5.1  # also pulled in by anemoi-training, -inference, -datasets
#  - anemoi-graphs>=0.9.9  # also pulled in by anemoi-training, -models
#  - anemoi-models>=0.20.0  # also pulled in by anemoi-training
#  - anemoi-utils>=0.5.14  # also pulled in by all anemoi packages

  # GPU stack: CUDA 12.9 builds (Gadi GPU driver 580.x supports up to CUDA 13.0)
  - cuda-version=12.9
  - pytorch=*=cuda*  # also pulled in by anemoi-training/-models/-graphs/-inference; listed to force a CUDA build
  - flash-attn  # replaces the custom pip flash-attn wheel

  # Compulsory deps missing from the conda recipes (pip extras are dropped by conda)
  - jinja2>=3.1  # anemoi-models[migrations] (required by anemoi-training); also pulled in by pytorch_geometric, earthkit-data
  - mlflow>=2.11.1  # anemoi-utils[mlflow] (training); includes mlflow-skinny
  - requests  # anemoi-utils[mlflow]; also pulled in by mlflow, earthkit-data, pytorch_geometric
  - gitpython  # anemoi-utils[provenance] (training, inference); also pulled in by mlflow
  - nvsmi  # anemoi-utils[provenance]; imported by anemoi-training at runtime; on conda-pypi
  - obstore  # anemoi-utils[s3] -> [remote] (datasets)
  - termcolor  # anemoi-utils[text] (inference)
  - wcwidth  # anemoi-utils[text] (inference); also pulled in by mlflow (via skops -> prettytable)

  # Training profiler (optional anemoi-training[profile] extra)
  - pandas>=1.3.2  # also pulled in by anemoi-transform (pandas<3), mlflow, xarray
  - tabulate>=0.9  # not pulled in by anything else
  - rich>=13.6 # also pulled in by other anemoi package
  - holistictraceanalysis>=0.2 # on conda-pypi

  # Training plotting (optional anemoi-training[plotting] extra)
  - cartopy>=0.25
  - datashader>=0.17
  - distinctipy>=1
  - matplotlib>=3.7.1
  - pyshtools>=4.13 # spectral diagnostics

  # Graph streched-grid (optional anemoi-graphs[healpix,hex,tri] extra)
  - healpy>=1.17
  - h3-py>=4
  - trimesh>=4.1

  # Inference plotting (optional anemoi-inference[plotting] extra)
  - earthkit-plots<1 # on conda-pypi
  - matplotlib<3.11
#  - eckitlib<2.3.0.28 # c++ library not on conda, not needed now because of not needing MIR
  - metview-batch # backend for MIR, eckit, Metview C++
  - metview-python # python interface for metview and its MIR, eckit

  # AIFS_scripts inference workflow
  - ecmwf-opendata=0.3.20  # opendata IC download
#  - tensorboard  # training monitoring
#  - pynvml  # GPU monitoring
  - ecmwf-api-client  # MARS access
  - huggingface_hub  # get checkpoint from huggingface
  - scores  # verification

  # Only packages not available (or too old) on conda-forge
  - pip
#  - pip:
#    - pyodc>=1.6  # anemoi-datasets (conda-forge only has 1.3.0, recipe omits it)
